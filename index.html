  <style>
    :root {
      --red:      #c41e1e;
      --red-glow: rgba(196,30,30,0.18);
      --black:    #0a0a0a;
      --card:     #141414;
      --white:    #e8e8e8;
      --dim:      #999999;
      --border:   rgba(196,30,30,0.25);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Barlow', sans-serif;
      font-weight: 400;
      line-height: 1.6;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.04;
      pointer-events: none;
      z-index: 999;
    }

    h1, h2, h3 { font-family: 'Metamorphous', serif; letter-spacing: 0.03em; line-height: 1.1; }

    .label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.28em;
      color: var(--red);
      text-transform: uppercase;
      display: block;
      margin-bottom: 1rem;
    }

    em { font-style: italic; color: var(--red); font-weight: 300; }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 4rem;
      transition: background 0.4s, border-bottom 0.4s;
    }
    nav.scrolled {
      background: rgba(10,10,10,0.96);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px);
    }
    .nav-logo {
      font-family: 'Metamorphous', serif;
      font-size: 1rem;
      letter-spacing: 0.08em;
      color: var(--red);
      text-decoration: none;
      opacity: 0;
      transition: opacity 0.4s;
    }
    nav.scrolled .nav-logo { opacity: 1; }
    .nav-links { display: flex; gap: 2.5rem; list-style: none; }
    .nav-links a {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: var(--dim);
      text-decoration: none;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--red); }

    #hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6rem 2rem 4rem;
      position: relative;
    }
    #hero::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: 600px; height: 600px;
      background: radial-gradient(ellipse, var(--red-glow) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-logo {
      width: 400px; height: 400px;
      object-fit: contain;
      mix-blend-mode: lighten;
      margin-bottom: 2.5rem;
      position: relative; z-index: 1;
      animation: fadeInDown 0.9s ease both;
    }

      font-size: clamp(2.4rem, 5.5vw, 4.5rem);
      letter-spacing: 0.08em;
      color: var(--white);
